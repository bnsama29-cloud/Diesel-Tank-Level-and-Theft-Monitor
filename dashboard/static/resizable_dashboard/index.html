<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { color: #e8f2fb; background: #0b1220; font: 14px system-ui, sans-serif; }
    #dashboard {
      display: grid;
      grid-template-columns: minmax(260px, 34%) minmax(0, 1fr);
      gap: 12px;
      width: 100%;
      min-height: 660px;
      padding: 8px;
    }
    .panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(125,175,210,.24);
      border-radius: 12px;
      background: linear-gradient(145deg, #14263a, #0e1b2c);
    }
    .panel-head {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 13px;
      color: #eaf4fb;
      font-weight: 700;
    }
    #freshness { color: #9eb5c9; font-size: 12px; font-weight: 400; text-align: right; }
    #values-content { padding: 3px 11px 12px; }
    .notice {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
      padding: 11px;
      border-radius: 9px;
      line-height: 1.4;
      background: rgba(66,211,200,.14);
    }
    .notice.warning { background: rgba(244,190,76,.2); }
    .notice.danger, .notice.error { background: rgba(255,100,110,.18); }
    .notice.error { overflow-wrap: anywhere; }
    .notice.small { font-size: 12px; }
    .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .metric {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
      min-height: 74px;
      padding: 10px;
      border: 1px solid rgba(125,175,210,.2);
      border-radius: 9px;
      background: rgba(25,46,67,.68);
    }
    .metric span { color: #9eb5c9; font-size: 11px; }
    .metric strong { overflow-wrap: anywhere; font-size: clamp(16px, 1.7vw, 23px); }
    #sensor-note { margin: 10px 2px 0; color: #9eb5c9; font-size: 12px; line-height: 1.45; }
    #graph-panel { display: flex; flex-direction: column; }
    #graph-content { flex: 1; min-height: 0; padding: 0 7px 8px; }
    #history-chart { width: 100%; height: 100%; min-height: 560px; }
    #empty-chart { display: grid; min-height: 560px; place-items: center; color: #9eb5c9; text-align: center; }
    @media (max-width: 760px) {
      #dashboard { display: flex; flex-direction: column; min-height: 0; }
      #values-panel { flex: none; }
      #graph-panel { min-height: 490px; }
      #history-chart, #empty-chart { min-height: 430px; }
      .metric { min-height: 68px; }
      .metric strong { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main id="dashboard">
    <section class="panel" id="values-panel">
      <header class="panel-head">
        <span>Latest readings</span>
        <span id="freshness">Waiting for data</span>
      </header>
      <div id="values-content">
        <div class="notice error" id="status-notice"></div>
        <div class="notice error small" id="fetch-error" hidden></div>
        <div class="metrics">
          <div class="metric"><span>Fuel remaining</span><strong id="litres">—</strong></div>
          <div class="metric"><span>Tank level</span><strong id="level">—</strong></div>
          <div class="metric"><span>Generator</span><strong id="generator">—</strong></div>
          <div class="metric"><span>Refill pump</span><strong id="pump">—</strong></div>
          <div class="metric"><span>Estimated runtime</span><strong id="runtime">—</strong></div>
        </div>
        <p id="sensor-note">No sensor reading received yet.</p>
      </div>
    </section>
    <section class="panel" id="graph-panel">
      <header class="panel-head"><span>Fuel level history</span><span>Last 5 minutes</span></header>
      <div id="graph-content">
        <div id="history-chart" hidden></div>
        <div id="empty-chart">The graph appears after at least two readings.</div>
      </div>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
