<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: #e8f2fb; background: #0b1220; font: 14px system-ui, sans-serif; }
    #dashboard {
      --left-size: 25%;
      --interpretation-size: 42%;
      display: grid;
      grid-template-columns: minmax(220px, var(--left-size)) 10px minmax(0, 1fr);
      width: 100%;
      height: 100%;
      min-height: 640px;
      padding: 8px;
    }
    #left-column {
      display: grid;
      grid-template-rows: minmax(170px, var(--interpretation-size)) 10px minmax(240px, 1fr);
      min-width: 0;
      min-height: 0;
    }
    .panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(125,175,210,.24);
      border-radius: 12px;
      background: linear-gradient(145deg, #14263a, #0e1b2c);
    }
    .panel-head {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 12px;
      color: #eaf4fb;
      font-weight: 700;
    }
    #interpretation-content {
      height: calc(100% - 42px);
      overflow: auto;
      padding: 4px 10px 10px;
    }
    #freshness { color: #9eb5c9; font-size: 12px; font-weight: 400; text-align: right; }
    .notice {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 9px;
      padding: 10px;
      border-radius: 9px;
      line-height: 1.35;
      background: rgba(66,211,200,.14);
    }
    .notice.warning { background: rgba(244,190,76,.2); }
    .notice.danger, .notice.error { background: rgba(255,100,110,.18); }
    .notice.error { overflow-wrap: anywhere; }
    .notice.small { font-size: 12px; }
    .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .metric {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      padding: 8px;
      border: 1px solid rgba(125,175,210,.2);
      border-radius: 9px;
      background: rgba(25,46,67,.68);
    }
    .metric span { color: #9eb5c9; font-size: 11px; }
    .metric strong { overflow-wrap: anywhere; font-size: clamp(15px, 1.6vw, 21px); }
    #sensor-note { margin: 8px 2px 0; color: #9eb5c9; font-size: 11px; line-height: 1.4; }
    #graph-content { width: 100%; height: calc(100% - 42px); padding: 0 5px 6px; }
    #history-chart { width: 100%; height: 100%; }
    #empty-chart { display: grid; height: 100%; place-items: center; color: #9eb5c9; text-align: center; }
    .splitter { position: relative; z-index: 2; touch-action: none; user-select: none; }
    .splitter::after {
      position: absolute;
      content: "";
      border-radius: 4px;
      background: rgba(125,175,210,.35);
      transition: background .15s;
    }
    .splitter:hover::after, .splitter.dragging::after { background: #42d3c8; }
    #column-splitter { cursor: col-resize; }
    #column-splitter::after { top: 40%; bottom: 40%; left: 3px; right: 3px; }
    #row-splitter { cursor: row-resize; }
    #row-splitter::after { left: 40%; right: 40%; top: 3px; bottom: 3px; }
    #simulation-panel { display: flex; flex-direction: column; margin-left: 4px; }
    #simulation-frame { flex: 1; width: 100%; min-height: 0; border: 0; background: #101923; }
    button {
      border: 1px solid #507895;
      border-radius: 6px;
      padding: 5px 9px;
      color: #e8f2fb;
      background: #23455f;
      font: inherit;
      cursor: pointer;
    }
    @media (max-width: 820px) {
      #dashboard { display: flex; flex-direction: column; overflow: auto; min-height: 100%; }
      #left-column { display: contents; }
      #interpretation-panel { min-height: 340px; }
      #graph-panel { min-height: 360px; }
      #simulation-panel { min-height: 580px; margin: 0; }
      .splitter { display: none; }
    }
  </style>
</head>
<body>
  <main id="dashboard">
    <section id="left-column">
      <section class="panel" id="interpretation-panel">
        <header class="panel-head">
          <span>System interpretation</span>
          <span id="freshness">Waiting for data</span>
        </header>
        <div id="interpretation-content">
          <div class="notice error" id="status-notice"></div>
          <div class="notice error small" id="fetch-error" hidden></div>
          <div class="metrics">
            <div class="metric"><span>Fuel remaining</span><strong id="litres">—</strong></div>
            <div class="metric"><span>Tank level</span><strong id="level">—</strong></div>
            <div class="metric"><span>Generator</span><strong id="generator">—</strong></div>
            <div class="metric"><span>Refill pump</span><strong id="pump">—</strong></div>
            <div class="metric"><span>Estimated runtime</span><strong id="runtime">—</strong></div>
          </div>
          <p id="sensor-note">No sensor reading received yet.</p>
        </div>
      </section>
      <div class="splitter" id="row-splitter" role="separator" aria-orientation="horizontal" aria-label="Resize interpretation and graph"></div>
      <section class="panel" id="graph-panel">
        <header class="panel-head"><span>Fuel level history</span><span>Last 5 minutes</span></header>
        <div id="graph-content">
          <div id="history-chart" hidden></div>
          <div id="empty-chart">The fuel graph appears after at least two readings.</div>
        </div>
      </section>
    </section>
    <div class="splitter" id="column-splitter" role="separator" aria-orientation="vertical" aria-label="Resize dashboard and simulation"></div>
    <section class="panel" id="simulation-panel">
      <header class="panel-head">
        <span>Wokwi simulation · Drag splitters to resize panels</span>
        <button id="enlarge-simulation" type="button">Enlarge</button>
      </header>
      <iframe id="simulation-frame" src="https://wokwi.com/projects/478875514435866625?embed=1" title="Interactive Wokwi diesel tank simulation" allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
